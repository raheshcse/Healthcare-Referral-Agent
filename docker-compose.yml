services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xverba-backend
    ports:
      - "8000:8000"
    environment:
      XVERBA_HOST: 0.0.0.0
      XVERBA_PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env before starting Docker}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: xverba-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
